name: CI
on: [push]
# theme-check-action reports its result as a check run; the default read-only token cannot create one.
permissions:
  contents: read
  checks: write
jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}
